<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440"><rect width="920" height="440" rx="18" fill="#f2f5f1"/><g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#21382a"><text x="38" y="54" font-size="26" font-weight="600">加载扩展时，选择哪一层文件夹？</text><text x="38" y="90" font-size="16" fill="#5d7163">目录示意，文件管理器外观可能不同。</text><rect x="38" y="118" width="560" height="270" rx="12" fill="white" stroke="#cfdbd0"/><text x="62" y="155" font-size="19" font-weight="600">解压后的插件文件夹</text><rect x="58" y="176" width="510" height="48" rx="7" fill="#e3efe3"/><g font-family="Consolas,monospace" font-size="18"><text x="83" y="207" font-weight="600">manifest.json</text><text x="83" y="253">content.js</text><text x="83" y="291">service-worker.js</text><text x="83" y="329">settings.html</text><text x="83" y="367">help.html ...</text></g><path d="M620 201h83" stroke="#28744b" stroke-width="3"/><text x="722" y="194" font-size="18" font-weight="600">看到这个文件，</text><text x="722" y="222" font-size="18" font-weight="600">就选择它所在的文件夹。</text><text x="624" y="294" font-size="16" fill="#69766c">不要选择ZIP文件本身。</text><text x="624" y="325" font-size="16" fill="#69766c">不要停在外面多套的一层。</text></g></svg>
